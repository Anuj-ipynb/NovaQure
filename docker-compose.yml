services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: novaqure-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////app/data/novaqure.db
      - SECRET_KEY=novaqure-review-production-key-2026
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - LLM_PROVIDER=granite
      - OLLAMA_MODEL=granite4.1:3b
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - novaqure_db_data:/app/data

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: novaqure-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: novaqure-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://frontend:80
    depends_on:
      - frontend

volumes:
  novaqure_db_data:
